<!DOCTYPE html>
<html lang="es">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataGrada</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DataGrada">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card bg-secondary text-light p-4 shadow-lg" style="width: 100%; max-width: 400px; border-radius: 15px; background-color: #262626 !important; border: 1px solid #333 !important;">
        <div class="text-center mb-4">
            <img src="logo.png" alt="DataGrada" style="height: 70px; width: auto; object-fit: contain;">
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="username" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control bg-dark text-light border-secondary border-end-0" id="password" required>
                    <button type="button" class="btn btn-outline-secondary border-start-0 bg-dark text-muted" id="btnTogglePassword" style="border-color: #6c757d !important;" onclick="togglePassword()">
                        👁️
                    </button>
                </div>
                <div id="avisoMayus" class="form-text text-muted d-none mt-1" style="font-size: 0.75rem; color: #9ca3af !important;">
                    ⚠️ Mayúsculas activadas
                </div>
            </div>

            <div id="mensajeError" class="alert alert-danger d-none" role="alert">
                Usuario o contraseña incorrectos.
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold mb-3" style="background-color: #f43f5e; border-color: #f43f5e;">Entrar</button>
            
            <!-- ENLACE PARA ABRIR EL REGISTRO -->
            <div class="text-center">
                <span class="text-muted small">¿No tienes cuenta?</span> 
                <a href="#" class="small text-decoration-none fw-bold" style="color: #f43f5e;" data-bs-toggle="modal" data-bs-target="#modalRegistro">Regístrate aquí</a>
            </div>
        </form>
    </div>

    <!-- MODAL DE REGISTRO -->
    <div class="modal fade" id="modalRegistro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: #262626; border: 1px solid #333; color: white; border-radius: 15px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">📝 Crear una cuenta</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="registroForm">
                        <div class="mb-3">
                            <label class="form-label text-light">Nuevo Usuario</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="reg-username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light">Contraseña</label>
                            <input type="password" class="form-control bg-dark text-light border-secondary" id="reg-password" required>
                        </div>
                        <div id="mensajeRegistroError" class="alert alert-danger d-none" role="alert"></div>
                        <div id="mensajeRegistroExito" class="alert alert-success d-none" role="alert">¡Cuenta creada con éxito! Ya puedes iniciar sesión.</div>
                        <button type="submit" class="btn w-100 fw-bold text-white mt-2" style="background-color: #f43f5e; border: none;">Registrarse</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tokenGuardado = localStorage.getItem('token');
        if (tokenGuardado) {
            fetch(`${API_BASE_URL}/api/usuarios/me`, {
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + tokenGuardado }
            })
            .then(res => {
                if (res.ok) window.location.href = 'inicio.html';
                else localStorage.removeItem('token');
            })
            .catch(() => localStorage.removeItem('token'));
        }

        function togglePassword() {
            const inputPass = document.getElementById('password');
            const btn = document.getElementById('btnTogglePassword');
            if (inputPass.type === 'password') {
                inputPass.type = 'text';
                btn.textContent = '👁️‍🗨️';
            } else {
                inputPass.type = 'password';
                btn.textContent = '👁️';
            }
        }

        const passwordInput = document.getElementById('password');
        const avisoMayus = document.getElementById('avisoMayus');
        passwordInput.addEventListener('keyup', (e) => {
            const isCapsOn = e.getModifierState && e.getModifierState('CapsLock');
            avisoMayus.classList.toggle('d-none', !isCapsOn);
        });

        // LÓGICA DEL FORMULARIO DE REGISTRO
        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const errDiv = document.getElementById('mensajeRegistroError');
            const successDiv = document.getElementById('mensajeRegistroExito');

            errDiv.classList.add('d-none');
            successDiv.classList.add('d-none');

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    successDiv.classList.remove('d-none');
                    setTimeout(() => {
                        bootstrap.Modal.getInstance(document.getElementById('modalRegistro')).hide();
                        document.getElementById('registroForm').reset();
                        successDiv.classList.add('d-none');
                    }, 2000);
                } else {
                    const errorText = await response.text();
                    errDiv.textContent = errorText || "El usuario ya existe o no es válido.";
                    errDiv.classList.remove('d-none');
                }
            } catch (err) {
                errDiv.textContent = "Error de conexión con el servidor.";
                errDiv.classList.remove('d-none');
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
