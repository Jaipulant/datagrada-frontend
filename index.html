<!DOCTYPE html>
<html lang="es">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataGrada</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card bg-secondary text-light p-4 shadow-lg" style="width: 100%; max-width: 400px; border-radius: 15px;">
        <div class="text-center mb-4">
            <img src="logo.png" alt="DataGrada" style="height: 70px; width: auto; object-fit: contain;">
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="username" required>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control bg-dark text-light border-secondary border-end-0" id="password" required>
                    <button type="button" class="btn btn-outline-secondary border-start-0 bg-dark text-muted" id="btnTogglePassword" style="border-color: #6c757d !important;" onclick="togglePassword()">
                        👁️
                    </button>
                </div>
                <!-- Aviso de mayúsculas sutil y discreto -->
                <div id="avisoMayus" class="form-text text-muted d-none mt-1" style="font-size: 0.75rem; color: #9ca3af !important;">
                    ⚠️ Mayúsculas activadas
                </div>
            </div>

            <div id="mensajeError" class="alert alert-danger d-none" role="alert">
                Usuario o contraseña incorrectos.
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
        </form>
    </div>

    <script>
        if (localStorage.getItem('token')) {
            window.location.href = 'inicio.html';
        }

        // Función para mostrar/ocultar contraseña con el ojito
        function togglePassword() {
            const inputPass = document.getElementById('password');
            const btn = document.getElementById('btnTogglePassword');
            if (inputPass.type === 'password') {
                inputPass.type = 'text';
                btn.textContent = '👁️‍🗨️'; // Cambia ligeramente el icono para indicar que está visible
            } else {
                inputPass.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // Detección de Bloq Mayús (Caps Lock)
        const passwordInput = document.getElementById('password');
        const avisoMayus = document.getElementById('avisoMayus');

        passwordInput.addEventListener('keyup', function(e) {
            // getModifierState comprueba si las mayúsculas están activas
            const isCapsOn = e.getModifierState && e.getModifierState('CapsLock');
            if (isCapsOn) {
                avisoMayus.classList.remove('d-none');
            } else {
                avisoMayus.classList.add('d-none');
            }
        });

        passwordInput.addEventListener('keydown', function(e) {
            const isCapsOn = e.getModifierState && e.getModifierState('CapsLock');
            if (isCapsOn) {
                avisoMayus.classList.remove('d-none');
            } else {
                avisoMayus.classList.add('d-none');
            }
        });

        passwordInput.addEventListener('blur', function() {
            avisoMayus.classList.add('d-none');
        });
    </script>
    <script src="login.js"></script>
</body>
</html>
