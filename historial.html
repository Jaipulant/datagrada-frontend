<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataGrada | Historial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <meta name="referrer" content="no-referrer">
    <script src="config.js"></script>
    <style>
        /* Estilo limpio tipo tarjeta para cada partido (evita que se monte nada) */
        .partido-row {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .partido-row:hover {
            border-color: #f43f5e;
        }
    </style>
</head>
<body>

<!-- Barra de navegación responsive -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="inicio.html">ᯓ⚽️ DataGrada</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto align-items-lg-center">
                <a class="nav-link active" href="historial.html">Historial</a>
                <a class="nav-link" href="partidonuevo.html">Añadir Partido</a>
                <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm mt-2 mt-lg-0 ms-lg-2">Cerrar Sesión</button>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4 d-flex align-items-center">
        Historial de Partidos
        <span id="contador-partidos" class="badge bg-danger rounded-pill ms-3 fs-6">0</span>
    </h2>

    <!-- Zona de Filtros Responsive -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-12 col-md-3">
                    <select id="filtro-competicion" class="form-select">
                        <option value="">Todas las competiciones</option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <select id="filtro-equipo" class="form-select">
                        <option value="">Cualquier equipo</option>
                    </select>
                </div>
                <div class="col-12 col-md-3">
                    <input type="date" id="filtro-fecha" class="form-control">
                </div>
                <div class="col-12 col-md-2">
                    <button class="btn btn-primary w-100" onclick="aplicarFiltros()">Filtrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenedor del Historial (Diseño en lista de tarjetas limpias) -->
    <div class="card shadow bg-transparent border-0">
        <div class="card-body p-0" id="tabla-partidos">
            <!-- El contenido se inyecta dinámicamente desde JavaScript -->
        </div>

        <!-- Controles de Paginación -->
        <div class="d-flex justify-content-between align-items-center mt-4 mb-3 px-2">
            <button class="btn btn-paginacion" id="btn-prev" onclick="cambiarPagina(-1)" disabled>Anterior</button>
            <span class="text-light fw-bold" id="info-paginacion">Página 1</span>
            <button class="btn btn-paginacion" id="btn-next" onclick="cambiarPagina(1)" disabled>Siguiente</button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = 'index.html';
    }

    let todosLosPartidos = [];
    let todosLosEquipos = []; 
    let buscadorCompeticionHistorial, buscadorEquipoHistorial;
    let paginaActual = 1;
    const partidosPorPagina = 20; // 20 por página para que cargue fluido en móvil
    let listaActualFiltrada = []; 

    document.addEventListener("DOMContentLoaded", function() {
        cargarFiltros();
        cargarTodosLosPartidos();

        document.getElementById('filtro-competicion').addEventListener('change', function() {
            actualizarDesplegableEquipos(this.value);
        });
    });

    function cargarFiltros() {
        fetch(`${API_BASE_URL}/api/competiciones`, {
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
        })
        .then(res => res.json())
        .then(competiciones => {
            const selectComp = document.getElementById('filtro-competicion');
            competiciones.forEach(comp => {
                selectComp.innerHTML += `<option value="${comp.idCompeticion}">${comp.nombre}</option>`;
            });
            buscadorCompeticionHistorial = new TomSelect("#filtro-competicion", { create: false, sortField: { field: "text" } });
        });

        fetch(`${API_BASE_URL}/api/equipos`, {
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
        })
        .then(res => res.json())
        .then(equipos => {
            equipos.sort((a, b) => a.nombre.localeCompare(b.nombre));
            todosLosEquipos = equipos; 
            dibujarDesplegableEquipos(todosLosEquipos); 
        });
    }

    function actualizarDesplegableEquipos(idCompeticionSeleccionada) {
        if (idCompeticionSeleccionada === "") {
            dibujarDesplegableEquipos(todosLosEquipos);
            return;
        }

        const partidosDeEstaCompeticion = todosLosPartidos.filter(p => 
            p.competicion.idCompeticion.toString() === idCompeticionSeleccionada
        );

        const equiposUnicos = new Map();
        partidosDeEstaCompeticion.forEach(partido => {
            equiposUnicos.set(partido.equipoLocal.idEquipos, partido.equipoLocal);
            equiposUnicos.set(partido.equipoVisitante.idEquipos, partido.equipoVisitante);
        });

        const listaEquiposFiltrada = Array.from(equiposUnicos.values());
        listaEquiposFiltrada.sort((a, b) => a.nombre.localeCompare(b.nombre));
        
        dibujarDesplegableEquipos(listaEquiposFiltrada);
    }

    function dibujarDesplegableEquipos(listaEquipos) {
        const selectEq = document.getElementById('filtro-equipo');
        if (buscadorEquipoHistorial) buscadorEquipoHistorial.destroy();
        selectEq.innerHTML = '<option value="">Cualquier equipo</option>'; 
        listaEquipos.forEach(eq => {
            selectEq.innerHTML += `<option value="${eq.idEquipos}">${eq.nombre}</option>`;
        });
        buscadorEquipoHistorial = new TomSelect("#filtro-equipo", { create: false, sortField: { field: "text" } });
    }

    function cargarTodosLosPartidos() {
        fetch(`${API_BASE_URL}/api/partidos`, {
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
        })
        .then(respuesta => respuesta.json())
        .then(partidos => {
            partidos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha)); // Los más recientes primero
            todosLosPartidos = partidos;
            dibujarTabla(todosLosPartidos);
        })
        .catch(error => console.error("Error al cargar el historial:", error));
    }

    function dibujarTabla(listaPartidos) {
        listaActualFiltrada = listaPartidos; 
        document.getElementById('contador-partidos').innerText = listaPartidos.length;
        
        const contenedor = document.getElementById('tabla-partidos');
        contenedor.innerHTML = '';

        if(listaPartidos.length === 0) {
            contenedor.innerHTML = '<div class="text-center py-5 text-muted card p-4">No se encontraron partidos.</div>';
            document.getElementById('info-paginacion').innerText = `Página 1 de 1`;
            document.getElementById('btn-prev').disabled = true;
            document.getElementById('btn-next').disabled = true;
            return;
        }

        const totalPaginas = Math.ceil(listaPartidos.length / partidosPorPagina);
        if (paginaActual > totalPaginas) paginaActual = totalPaginas;

        const inicio = (paginaActual - 1) * partidosPorPagina;
        const fin = inicio + partidosPorPagina;
        const partidosPagina = listaPartidos.slice(inicio, fin);

        partidosPagina.forEach(partido => {
            const escudoLocal = partido.equipoLocal.urlEscudo || 'https://via.placeholder.com/32';
            const escudoVisitante = partido.equipoVisitante.urlEscudo || 'https://via.placeholder.com/32';
            const textoJornada = isNaN(partido.jornada) ? partido.jornada : 'Jornada ' + partido.jornada;

            // Renderizado en tarjeta flexible (Adiós a los montajes en móvil)
            const tarjeta = `
                <div class="partido-row p-3 mb-3 d-flex flex-column flex-md-row align-items-center justify-content-between gap-3 shadow-sm">
                    
                    <!-- Fecha y Competición -->
                    <div class="text-center text-md-start" style="min-width: 140px;">
                        <span class="text-muted d-block small">${partido.fecha}</span>
                        <span class="text-light fw-bold">${partido.competicion.nombre}</span>
                        <span class="text-muted d-block" style="font-size: 0.8rem;">${textoJornada}</span>
                    </div>

                    <!-- Enfrentamiento (Local vs Visitante con resultado en medio) -->
                    <div class="d-flex align-items-center justify-content-center flex-grow-1 gap-2 gap-md-4 w-100">
                        <!-- Local -->
                        <div class="d-flex align-items-center justify-content-end text-end flex-fill gap-2" style="overflow: hidden;">
                            <span class="text-light fw-bold text-truncate" style="max-width: 110px; md-max-width: 180px;">${partido.equipoLocal.nombre}</span>
                            <img src="${escudoLocal}" alt="Local" style="width: 32px; height: 32px; object-fit: contain; flex-shrink: 0;">
                        </div>

                        <!-- Marcador -->
                        <div class="fs-4 fw-bold px-3 py-1 rounded text-center" style="background-color: #111; color: #ffd32a; min-width: 80px; letter-spacing: 2px;">
                            ${partido.golesLocal} - ${partido.golesVisitante}
                        </div>

                        <!-- Visitante -->
                        <div class="d-flex align-items-center justify-content-start text-start flex-fill gap-2" style="overflow: hidden;">
                            <img src="${escudoVisitante}" alt="Visitante" style="width: 32px; height: 32px; object-fit: contain; flex-shrink: 0;">
                            <span class="text-light fw-bold text-truncate" style="max-width: 110px; md-max-width: 180px;">${partido.equipoVisitante.nombre}</span>
                        </div>
                    </div>

                    <!-- Botones de Acción (Editar / Borrar) -->
                    <div class="dropdown text-end" style="min-width: 40px;">
                        <button class="btn btn-sm text-muted px-2 py-1 border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="background: #2a2a2a;">⚙️</button>
                        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark shadow" style="min-width: 120px;">
                            <li><button class="dropdown-item text-warning fw-bold" onclick="abrirModalEditar(${partido.idPartidos})">✏️ Editar</button></li>
                            <li><hr class="dropdown-divider border-secondary"></li>
                            <li><button class="dropdown-item text-danger fw-bold" onclick="borrarPartido(${partido.idPartidos})">🗑️ Borrar</button></li>
                        </ul>
                    </div>

                </div>
            `;
            contenedor.innerHTML += tarjeta;
        });

        document.getElementById('info-paginacion').innerText = `Página ${paginaActual} de ${totalPaginas}`;
        document.getElementById('btn-prev').disabled = paginaActual === 1;
        document.getElementById('btn-next').disabled = paginaActual === totalPaginas;
    }

    function cambiarPagina(direccion) {
        paginaActual += direccion; 
        dibujarTabla(listaActualFiltrada);
    }

    function aplicarFiltros() {
        const idCompeticion = document.getElementById('filtro-competicion').value;
        const idEquipo = document.getElementById('filtro-equipo').value;
        const fechaFiltro = document.getElementById('filtro-fecha').value;

        const filtrados = todosLosPartidos.filter(partido => {
            const cumpleComp = (idCompeticion === "" || partido.competicion.idCompeticion.toString() === idCompeticion);
            const cumpleEquipo = (idEquipo === "" || 
                                   partido.equipoLocal.idEquipos.toString() === idEquipo || 
                                   partido.equipoVisitante.idEquipos.toString() === idEquipo);
            const cumpleFecha = (fechaFiltro === "" || partido.fecha === fechaFiltro);

            return cumpleComp && cumpleEquipo && cumpleFecha;
        });

        paginaActual = 1; 
        dibujarTabla(filtrados);
    }

    function cerrarSesion() {
        localStorage.removeItem('token'); 
        window.location.href = 'index.html'; 
    }

    function borrarPartido(id) {
        if (!confirm("¿Estás seguro de que quieres borrar este partido?")) return;

        fetch(`${API_BASE_URL}/api/partidos/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(res => {
            if (res.ok) {
                alert("Partido borrado con éxito.");
                cargarTodosLosPartidos(); 
            } else {
                alert("Error al intentar borrar el partido.");
            }
        })
        .catch(error => console.error("Error al borrar:", error));
    }

    function abrirModalEditar(id) {
        const partido = todosLosPartidos.find(p => p.idPartidos === id); 
        if (!partido) return;

        document.getElementById('edit-id-partido').value = partido.idPartidos;
        document.getElementById('edit-fecha').value = partido.fecha;
        document.getElementById('edit-jornada').value = partido.jornada;
        document.getElementById('edit-goles-local').value = partido.golesLocal;
        document.getElementById('edit-goles-visitante').value = partido.golesVisitante;

        const modal = new bootstrap.Modal(document.getElementById('modalEditarPartido'));
        modal.show();
    }

    function guardarEdicion() {
        const id = document.getElementById('edit-id-partido').value;
        const partidoOriginal = todosLosPartidos.find(p => p.idPartidos == id);

        const partidoActualizado = {
            ...partidoOriginal,
            fecha: document.getElementById('edit-fecha').value,
            jornada: document.getElementById('edit-jornada').value,
            golesLocal: parseInt(document.getElementById('edit-goles-local').value),
            golesVisitante: parseInt(document.getElementById('edit-goles-visitante').value)
        };

        fetch(`${API_BASE_URL}/api/partidos/${id}`, {
            method: 'PUT',
            headers: { 
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(partidoActualizado)
        })
        .then(res => {
            if (res.ok) {
                alert("¡Partido actualizado correctamente!");
                bootstrap.Modal.getInstance(document.getElementById('modalEditarPartido')).hide();
                cargarTodosLosPartidos(); 
            } else {
                alert("Hubo un error al actualizar.");
            }
        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- MODAL: EDITAR PARTIDO -->
<div class="modal fade" id="modalEditarPartido" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background-color: #262626; border: 1px solid #333; color: white;">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold titulo-form text">✏️ Editar Partido</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="form-editar-partido">
                    <input type="hidden" id="edit-id-partido">
                    <div class="row mb-3">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label class="form-label text-light">Fecha</label>
                            <input type="date" id="edit-fecha" class="form-control" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label text-light">Jornada</label>
                            <input type="text" id="edit-jornada" class="form-control">
                        </div>
                    </div>
                    <div class="row align-items-center mb-3">
                        <div class="col-5">
                            <label class="form-label text-light">Goles Local</label>
                            <input type="number" id="edit-goles-local" class="form-control text-center fs-4 fw-bold" min="0" required>
                        </div>
                        <div class="col-2 text-center text-light fs-4 fw-bold">-</div>
                        <div class="col-5">
                            <label class="form-label text-light">Goles Visitante</label>
                            <input type="number" id="edit-goles-visitante" class="form-control text-center fs-4 fw-bold" min="0" required>
                        </div>
                    </div>
                    <button type="button" class="btn w-100 fw-bold text-white" style="background-color: #f43f5e; border: none;" onclick="guardarEdicion()">Actualizar Resultado</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
