<!DOCTYPE html>
<html lang="es">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataGrada | Registro</title>
    
    <!-- Iconos y configuración para app móvil / PWA -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DataGrada">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center" style="height: 100vh; background-color: #171717 !important;">

    <div class="card text-light p-4 shadow-lg" style="width: 100%; max-width: 400px; border-radius: 15px; background-color: #262626 !important; border: 1px solid #333;">
        <div class="text-center mb-4">
            <img src="logo.png" alt="DataGrada" style="height: 70px; width: auto; object-fit: contain;">
            <h4 class="fw-bold mt-2" style="color: #f43f5e; letter-spacing: 1px;">Nuevo Usuario</h4>
        </div>
        
        <form id="registerForm">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="username" placeholder="Ej: citizen_93" required>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control bg-dark text-light border-secondary border-end-0" id="password" required>
                    <button type="button" class="btn btn-outline-secondary border-start-0 bg-dark text-muted" id="btnTogglePassword" style="border-color: #6c757d !important;" onclick="togglePassword()">
                        👁️
                    </button>
                </div>
                <!-- Aviso de mayúsculas sutil y discreto -->
                <div id="avisoMayus" class="form-text text-muted d-none mt-1" style="font-size: 0.75rem; color: #9ca3af !important;">
                    ⚠️ Mayúsculas activadas
                </div>
            </div>

            <div id="mensajeError" class="alert alert-danger d-none" role="alert">
                El usuario ya existe.
            </div>

            <button type="submit" class="btn w-100 fw-bold text-white mb-3" style="background-color: #f43f5e; border: none; padding: 10px;">Registrarse</button>
            
            <div class="text-center">
                <a href="index.html" class="text-muted text-decoration-none small">¿Ya tienes cuenta? <span style="color: #f43f5e;">Inicia sesión</span></a>
            </div>
        </form>
    </div>

    <script>
        function togglePassword() {
            const inputPass = document.getElementById('password');
            const btn = document.getElementById('btnTogglePassword');
            if (inputPass.type === 'password') {
                inputPass.type = 'text';
                btn.textContent = '👁️‍🗨️';
            } else {
                inputPass.type = 'password';
                btn.textContent = '👁️';
            }
        }

        const passwordInput = document.getElementById('password');
        const avisoMayus = document.getElementById('avisoMayus');

        passwordInput.addEventListener('keyup', function(e) {
            const isCapsOn = e.getModifierState && e.getModifierState('CapsLock');
            if (isCapsOn) {
                avisoMayus.classList.remove('d-none');
            } else {
                avisoMayus.classList.add('d-none');
            }
        });

        passwordInput.addEventListener('keydown', function(e) {
            const isCapsOn = e.getModifierState && e.getModifierState('CapsLock');
            if (isCapsOn) {
                avisoMayus.classList.remove('d-none');
            } else {
                avisoMayus.classList.add('d-none');
            }
        });

        passwordInput.addEventListener('blur', function() {
            avisoMayus.classList.add('d-none');
        });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInputVal = document.getElementById('password').value;
            const mensajeError = document.getElementById('mensajeError');
            const btnRegistrar = document.querySelector('button[type="submit"]');

            mensajeError.classList.add('d-none');
            const textoOriginal = btnRegistrar.innerHTML;
            btnRegistrar.disabled = true;
            btnRegistrar.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Registrando...`;

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: usernameInput,
                        password: passwordInputVal
                    })
                });

                if (response.ok) {
                    alert('¡Cuenta creada con éxito! Ya puedes iniciar sesión.');
                    window.location.href = 'index.html'; 
                } else {
                    const errorText = await response.text();
                    mensajeError.textContent = errorText || 'El usuario ya existe.';
                    mensajeError.classList.remove('d-none');
                    btnRegistrar.disabled = false;
                    btnRegistrar.innerHTML = textoOriginal;
                }
            } catch (error) {
                console.error('Error al conectar con el servidor:', error);
                mensajeError.textContent = 'Fallo de conexión con el servidor.';
                mensajeError.classList.remove('d-none');
                btnRegistrar.disabled = false;
                btnRegistrar.innerHTML = textoOriginal;
            }
        });
    </script>
</body>
</html>
