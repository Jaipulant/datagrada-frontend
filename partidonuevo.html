<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataGrada | Insertar Partido</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <style>
        .form-control::placeholder,
        .ts-control input::placeholder {
            color: #52525b !important; 
            opacity: 0.8 !important;
            font-style: italic;
        }

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="inicio.html">
            <img src="logo.png" alt="DataGrada" style="height: 38px; width: auto; object-fit: contain;">
            <span class="fw-bold">DataGrada</span>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

            <div class="navbar-nav ms-auto align-items-lg-center">
                <a class="nav-link" href="historial.html">Historial</a>
                <a class="nav-link active" href="partidonuevo.html">Añadir Partido</a>
                <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm mt-2 mt-lg-0 ms-lg-2">Cerrar Sesión</button>
            </div>

</nav> 

<div class="container mt-4 mt-md-5">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-light mb-0">
            Registrar <span style="color: #f43f5e;">Partido</span>
        </h2>
    </div>

    <div class="card p-3 p-md-4 mx-auto" style="background-color: #262626; border: 1px solid #333; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);">
        <div class="card-body p-0">
            <form id="formulario-partido">
                
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6" id="col-competicion">
                        <label class="form-label">Competición</label>
                        <select id="select-competicion" class="form-select" required>
                            <option value="">Cargando competiciones...</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-3 d-none" id="col-jornada">
                        <label class="form-label">Jornada / Fase</label>
                        <select id="input-jornada" class="form-select" required>
                            <option value="">Selecciona...</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6" id="col-fecha">
                        <label class="form-label">Fecha</label>
                        <input type="date" id="input-fecha" class="form-control" required>
                    </div>
                </div>

                <div class="row g-3 align-items-center mb-4 text-center mt-2">
                    <div class="col-12 col-md-4">
                        <label class="form-label">Equipo Local</label>
                        <div class="input-group">
                            <select id="select-local" class="form-select" required>
                                <option value="">Selecciona Local</option>
                            </select>
                            <button class="btn btn-outline-primary fw-bold" type="button" data-bs-toggle="modal" data-bs-target="#modalEquipo">+</button>
                        </div>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label">Goles Local</label>
                        <input type="number" id="goles-local" class="form-control text-center fs-5 fw-bold" value="0" min="0" required>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label">Goles Visitante</label>
                        <input type="number" id="goles-visitante" class="form-control text-center fs-5 fw-bold" value="0" min="0" required>
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label">Equipo Visitante</label>
                        <div class="input-group">
                            <select id="select-visitante" class="form-select" required>
                                <option value="">Selecciona Visitante</option>
                            </select>
                            <button class="btn btn-outline-primary fw-bold" type="button" data-bs-toggle="modal" data-bs-target="#modalEquipo">+</button>
                        </div>
                    </div>
                </div>
                <!-- BLOQUE DESEMPATE DISCRETO -->
                <div class="text-center mb-3">
                    <button type="button" class="btn btn-sm btn-link text-muted text-decoration-none" onclick="toggleDesempate()" style="font-size: 0.85rem;">
                        + Añadir prórroga o penaltis
                    </button>
                </div>

                <div id="caja-desempate" class="d-none p-3 mb-4 mx-auto" style="background-color: #1e1e1e; border: 1px dashed #3f3f46; border-radius: 8px; max-width: 400px;">
                    <div class="d-flex justify-content-center gap-4 mb-2">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="check-prorroga">
                            <label class="form-check-label text-light small" for="check-prorroga">Prórroga</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="check-penaltis" onchange="toggleInputsPenaltis()">
                            <label class="form-check-label text-light small" for="check-penaltis">Penaltis</label>
                        </div>
                    </div>

                    <div id="inputs-penaltis" class="row justify-content-center d-none g-2 mt-1">
                        <div class="col-5">
                            <label class="form-label text-muted" style="font-size: 0.75rem;">Penaltis Local</label>
                            <input type="number" id="penaltis-local" class="form-control text-center p-1 bg-dark text-light border-secondary" min="0">
                        </div>
                        <div class="col-5">
                            <label class="form-label text-muted" style="font-size: 0.75rem;">Penaltis Visit.</label>
                            <input type="number" id="penaltis-visitante" class="form-control text-center p-1 bg-dark text-light border-secondary" min="0">
                        </div>
                    </div>
                </div>
                <!-- FIN BLOQUE DESEMPATE -->
                <div class="text-center mt-4">
                    <button type="button" class="btn btn-success px-5 py-2 fs-5 w-100 w-md-auto" onclick="guardarPartido()">Guardar Partido</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEquipo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="background-color: #262626; border: 1px solid #333; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div class="modal-header border-0 pb-0">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body px-3 px-md-5 pb-4 pb-md-5 pt-2">
                <div class="text-center mb-4">
                    <h2 class="fw-bold titulo-form">Nuevo <span class="resalto">Equipo</span></h2>
                    <p class="text-muted">Añade un nuevo club a la base de datos de DataGrada.</p>
                </div>

                <div class="row align-items-center">
                    <div class="col-12 col-md-7">
                        <form id="form-nuevo-equipo" onsubmit="guardarNuevoEquipo(event)">
                            <div class="mb-3">
                                <label class="form-label">Nombre del Club</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="nombre-equipo" placeholder="Ej: Manchester City" required>
                                    <button class="btn fw-bold text-white" style="background-color: #f43f5e; border: none;" type="button" id="btn-buscar-escudo" onclick="buscarDatosEquipo()">
                                        🔍 Autocompletar
                                    </button>
                                </div>
                                <div class="form-text text-muted small mt-1">Escribe el nombre y pulsa autocompletar para buscar su escudo y datos oficiales.</div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-12 col-md-6 mb-3 mb-md-0">
                                    <label class="form-label">País</label>
                                    <input type="text" class="form-control" id="pais-equipo" placeholder="Ej: England" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label">Estadio</label>
                                    <input type="text" class="form-control" id="estadio-equipo" placeholder="Ej: Etihad Stadium">
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">URL del Escudo (PNG preferible)</label>
                                <input type="url" class="form-control" id="url-escudo" placeholder="https://ejemplo.com/escudo.png">
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fs-5" style="border-radius: 8px;">
                                Guardar Equipo
                            </button>
                        </form>
                    </div>

                    <div class="col-12 col-md-5 text-center mt-4 mt-md-0">
                        <p class="text-muted small fw-bold mb-2" style="letter-spacing: 1px;">VISTA PREVIA</p>
                        <div class="vista-previa-escudo d-flex justify-content-center align-items-center mx-auto">
                            <img id="imagen-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233f3f46'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 19.93V3.19l7 3.11v4.7c0 4.67-3.13 8.96-7 10.03z'/></svg>" 
                                 alt="Vista previa" 
                                 style="width: 120px; height: 120px; object-fit: contain; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4)); transition: all 0.3s ease; opacity: 0.5;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

<script>
    // 1. Validación de sesión segura
    if (!esTokenValido()) throw new Error("Sesión inválida, deteniendo ejecución");
    const token = localStorage.getItem('token');

    let buscadorLocal, buscadorVisitante, buscadorCompeticion, selectJornadaTom;
    let todosLosEquipos = [];
    let todasLasCompeticiones = [];

    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('input-fecha').value = new Date().toISOString().split('T')[0];

        cargarEquipos();
        cargarCompeticiones();
        
        selectJornadaTom = new TomSelect("#input-jornada", { 
            create: true, 
            sortField: false, 
            maxItems: 1 
        });

        document.getElementById('select-competicion').addEventListener('change', function() {
            const idComp = this.value;
            const colJornada = document.getElementById('col-jornada');
            const colComp = document.getElementById('col-competicion');
            const colFecha = document.getElementById('col-fecha');

            if (!idComp) {
                colJornada.classList.add('d-none');
                colComp.className = 'col-12 col-md-6';
                colFecha.className = 'col-12 col-md-6';
                selectJornadaTom.clear();
                selectJornadaTom.clearOptions();
                return;
            }

            colJornada.classList.remove('d-none');
            colComp.className = 'col-12 col-md-6';
            colFecha.className = 'col-12 col-md-3';
            colJornada.className = 'col-12 col-md-3';

            const comp = todasLasCompeticiones.find(c => c.idCompeticion.toString() === idComp);
            if (!comp) return;

            selectJornadaTom.clear();
            selectJornadaTom.clearOptions();

            const tipo = (comp.tipo || "").toLowerCase();
            const nombre = (comp.nombre || "").toLowerCase();

            if (tipo === 'liga') {
                let totalJornadas = 38;
                if (nombre.includes('hypermotion')) {
                    totalJornadas = 42;
                } else if (nombre.includes('championship')) {
                    totalJornadas = 46;
                }

                const opciones = [];
                for (let i = 1; i <= totalJornadas; i++) {
                    opciones.push({ value: i.toString(), text: 'Jornada ' + i });
                }
                selectJornadaTom.addOption(opciones);
            } else if (tipo === 'copa' || tipo === 'europa') {
                selectJornadaTom.addOption([
                    { value: 'Fase de Liga', text: 'Fase de Liga' },
                    { value: '1/16 de final', text: '1/16 de final' },
                    { value: '1/8 de final', text: '1/8 de final' },
                    { value: '1/4 de final', text: '1/4 de final' },
                    { value: 'Semifinal', text: 'Semifinal' },
                    { value: 'Final', text: 'Final' }
                ]);
            } else if (tipo === 'selecciones') {
                selectJornadaTom.addOption([
                    { value: 'Fase de Grupos', text: 'Fase de Grupos' },
                    { value: '1/16 de final', text: '1/16 de final' },
                    { value: '1/8 de final', text: '1/8 de final' },
                    { value: '1/4 de final', text: '1/4 de final' },
                    { value: 'Semifinal', text: 'Semifinal' },
                    { value: 'Final', text: 'Final' }
                ]);
            } else if(tipo == 'amistoso'){
                selectJornadaTom.addOption([
                    {value: 'Amistoso', text: 'Amistoso'}
                ])
            } else {
                selectJornadaTom.addOption([
                    { value: 'Fase de Grupos', text: 'Fase de Grupos' },
                    { value: 'Fase de Liga', text: 'Fase de Liga' },
                    { value: '1/16 de final', text: '1/16 de final' },
                    { value: '1/8 de final', text: '1/8 de final' },
                    { value: '1/4 de final', text: '1/4 de final' },
                    { value: 'Semifinal', text: 'Semifinal' },
                    { value: 'Final', text: 'Final' }
                ]);
            }
        });
    });

    function cargarEquipos() {
        fetch(`${API_BASE_URL}/api/equipos`, {
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
        })
        .then(res => {
            if (res.status === 403) { window.location.href = 'index.html'; return; }
            return res.json();
        })
        .then(equipos => {
            if (!equipos) return;
            todosLosEquipos = equipos;

            const selectLocal = document.getElementById('select-local');
            const selectVisitante = document.getElementById('select-visitante');
            
            if(buscadorLocal) buscadorLocal.destroy();
            if(buscadorVisitante) buscadorVisitante.destroy();

            selectLocal.innerHTML = '<option value="">Selecciona Local</option>';
            selectVisitante.innerHTML = '<option value="">Selecciona Visitante</option>';

            equipos.sort((a, b) => a.nombre.localeCompare(b.nombre));

            equipos.forEach(equipo => {
                const opcion = `<option value="${equipo.idEquipos}">${equipo.nombre}</option>`;
                selectLocal.innerHTML += opcion;
                selectVisitante.innerHTML += opcion;
            });

            buscadorLocal = new TomSelect("#select-local", { create: false, sortField: { field: "text" } });
            buscadorVisitante = new TomSelect("#select-visitante", { create: false, sortField: { field: "text" } });
        });
    }

    function cargarCompeticiones() {
        fetch(`${API_BASE_URL}/api/competiciones`, {
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
        })
        .then(res => res.json())
        .then(competiciones => {
            todasLasCompeticiones = competiciones;
            
            const selectCompeticion = document.getElementById('select-competicion');
            if(buscadorCompeticion) buscadorCompeticion.destroy();
            selectCompeticion.innerHTML = '<option value="">Selecciona Competición</option>';
            
            competiciones.forEach(comp => {
                selectCompeticion.innerHTML += `<option value="${comp.idCompeticion}">${comp.nombre}</option>`;
            });
            buscadorCompeticion = new TomSelect("#select-competicion", { create: false, sortField: { field: "text" } });
        });
    }

    function buscarDatosEquipo() {
    const nombreInput = document.getElementById('nombre-equipo').value.trim();
    if (!nombreInput) {
        alert("Primero escribe el nombre de un equipo para buscarlo.");
        return;
    }

    const btn = document.getElementById('btn-buscar-escudo');
    btn.innerHTML = '⏳ Buscando...';
    btn.disabled = true;

    // Pega aquí la clave que has copiado en api-sports.io
    const apiKey = "4965ab735497c20ef0cc191c55e6cc7a";

    fetch(`https://v3.football.api-sports.io/teams?search=${encodeURIComponent(nombreInput)}`, {
        method: "GET",
        headers: {
            "x-apisports-key": apiKey
        }
    })
    .then(res => res.json())
    .then(data => {
        btn.innerHTML = '🔍 Autocompletar';
        btn.disabled = false;

        if (data.response && data.response.length > 0) {
            // Cogemos el primer resultado que coincida
            const equipo = data.response[0].team;
            const estadio = data.response[0].venue;

            // Rellenamos el país y el estadio
            if (equipo.country) document.getElementById('pais-equipo').value = equipo.country;
            if (estadio.name) document.getElementById('estadio-equipo').value = estadio.name;

            // Inyectamos el escudo PNG
            if (equipo.logo) {
                const urlInput = document.getElementById('url-escudo');
                urlInput.value = equipo.logo;
                urlInput.dispatchEvent(new Event('input')); // Fuerza a que aparezca en tu vista previa
            }
        } else {
            alert("No se ha encontrado el equipo. Intenta escribir el nombre de otra forma.");
        }
    })
    .catch(error => {
        btn.innerHTML = '🔍 Autocompletar';
        btn.disabled = false;
        console.error("Error en la API:", error);
        alert("Fallo al conectar con el buscador de escudos.");
    });
}

    function procesarRespuestaWikipedia(data) {
        restablecerBoton();

        // Extraemos la URL de la imagen (escudo)
        const urlImagen = (data.originalimage && data.originalimage.source) 
                    || (data.thumbnail && data.thumbnail.source);

        if (urlImagen) {
            const urlInput = document.getElementById('url-escudo');
            urlInput.value = urlImagen;
            urlInput.dispatchEvent(new Event('input')); // Forzamos la vista previa
        } else {
            alert("Se encontró el club en Wikipedia pero no tiene imagen de escudo disponible. Introduce la URL a mano.");
        }
}

function restablecerBoton() {
    const btn = document.getElementById('btn-buscar-escudo');
    btn.innerHTML = '🔍 Autocompletar';
    btn.disabled = false;
}

    function guardarNuevoEquipo(event) {
        event.preventDefault(); 

        const nombreInput = document.getElementById('nombre-equipo').value.trim();
        const paisInput = document.getElementById('pais-equipo').value.trim();
        const estadioInput = document.getElementById('estadio-equipo').value.trim();
        const urlEscudoInput = document.getElementById('url-escudo').value.trim();

        const equipoExiste = todosLosEquipos.some(equipo => 
            equipo.nombre.toLowerCase() === nombreInput.toLowerCase()
        );

        if (equipoExiste) {
            alert('¡Aviso! Ya existe un equipo llamado "' + nombreInput + '" en tu base de datos.');
            return; 
        }

        const nuevoEquipo = {
            nombre: nombreInput,
            pais: paisInput,
            estadio: estadioInput,
            urlEscudo: urlEscudoInput 
        };

        fetch(`${API_BASE_URL}/api/equipos`, {
            method: 'POST',
            headers: { 
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json' 
            }, 
            body: JSON.stringify(nuevoEquipo)
        })
        .then(res => {
            if(res.ok) {
                alert('¡Equipo añadido con éxito!');
                cargarEquipos(); 
                
                document.getElementById('nombre-equipo').value = '';
                document.getElementById('pais-equipo').value = '';
                document.getElementById('estadio-equipo').value = '';
                document.getElementById('url-escudo').value = '';
                document.getElementById('imagen-preview').src = escudoPorDefecto;
                document.getElementById('imagen-preview').style.opacity = '0.5';
                document.querySelector('.vista-previa-escudo').classList.remove('activa');
                
                bootstrap.Modal.getInstance(document.getElementById('modalEquipo')).hide();
            } else {
                alert('Hubo un error al guardar el equipo.');
            }
        });
    }

    function guardarPartido() {
        const idCompeticion = document.getElementById('select-competicion').value;
        const jornada = document.getElementById('input-jornada').value;
        const fecha = document.getElementById('input-fecha').value; 
        const idLocal = document.getElementById('select-local').value;
        const golesLocal = document.getElementById('goles-local').value;
        const golesVisitante = document.getElementById('goles-visitante').value;
        const idVisitante = document.getElementById('select-visitante').value;
        
        // NUEVAS VARIABLES DE DESEMPATE
        const checkProrroga = document.getElementById('check-prorroga').checked;
        const checkPenaltis = document.getElementById('check-penaltis').checked;
        const pLocal = document.getElementById('penaltis-local').value;
        const pVisitante = document.getElementById('penaltis-visitante').value;

        // Validaciones anteriores que ya tienes...
        if (!idCompeticion || !jornada || !fecha || !idLocal || !idVisitante || golesLocal === "" || golesVisitante === "") {
            alert("Por favor, rellena todos los campos obligatorios.");
            return;
        }

        if (idLocal === idVisitante) {  
            alert("¡Error! El equipo local y visitante no pueden ser el mismo.");
            return;
        }

        // OBJETO ACTUALIZADO
        const nuevoPartido = {
            fecha: fecha,
            jornada: jornada,
            golesLocal: parseInt(golesLocal),
            golesVisitante: parseInt(golesVisitante),
            competicion: { idCompeticion: parseInt(idCompeticion) },
            equipoLocal: { idEquipos: parseInt(idLocal) },
            equipoVisitante: { idEquipos: parseInt(idVisitante) },
            huboProrroga: checkProrroga,
            huboPenaltis: checkPenaltis,
            golesPenaltisLocal: checkPenaltis && pLocal !== "" ? parseInt(pLocal) : null,
            golesPenaltisVisitante: checkPenaltis && pVisitante !== "" ? parseInt(pVisitante) : null
        };

        fetch(`${API_BASE_URL}/api/partidos`, {
            method: 'POST',
            headers: { 
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json' 
            },
            body: JSON.stringify(nuevoPartido)
        })
        .then(respuesta => {
            if (respuesta.ok) {
                alert("¡Partido guardado con éxito!");
                if (buscadorLocal) buscadorLocal.clear();
                if (buscadorVisitante) buscadorVisitante.clear();
                
                document.getElementById('goles-local').value = 0;
                document.getElementById('goles-visitante').value = 0;
            } else {
                respuesta.text().then(errorTexto => {
                    console.error("Error del servidor:", errorTexto);
                    alert("Error al guardar: " + errorTexto);
                });
            }
        })
        .catch(error => {
            console.error("Error de conexión:", error);
            alert("Fallo de conexión con el servidor.");
        });
    }

    const inputUrl = document.getElementById('url-escudo');
    const imagenPreview = document.getElementById('imagen-preview');
    const cajaPreview = document.querySelector('.vista-previa-escudo');
    const escudoPorDefecto = imagenPreview.src; 

    inputUrl.addEventListener('input', function() {
        const url = this.value.trim();
        if (url !== '') {
            imagenPreview.src = url;
            imagenPreview.style.opacity = '1'; 
            cajaPreview.classList.add('activa'); 
            imagenPreview.onerror = () => {
                imagenPreview.src = escudoPorDefecto;
                imagenPreview.style.opacity = '0.5';
                cajaPreview.classList.remove('activa');
            };
        } else {
            imagenPreview.src = escudoPorDefecto;
            imagenPreview.style.opacity = '0.5'; 
            cajaPreview.classList.remove('activa');
        }
    });

    function toggleDesempate() {
        document.getElementById('caja-desempate').classList.toggle('d-none');
    }

    function toggleInputsPenaltis() {
        const check = document.getElementById('check-penaltis').checked;
        const cajaInputs = document.getElementById('inputs-penaltis');
        if(check) cajaInputs.classList.remove('d-none');
        else cajaInputs.classList.add('d-none');
    }
    function cerrarSesion() {
        localStorage.removeItem('token'); 
        window.location.href = 'index.html'; 
    }
</script>
